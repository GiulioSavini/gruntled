name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; master runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build with exactly the Go version from go.mod; never switch silently.
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$("$(go env GOROOT)/bin/gofmt" -l .)
          if [ -n "$out" ]; then
            echo "unformatted:"
            echo "$out"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: sarif-schema
        # Real SARIF output must validate against the vendored OASIS 2.1.0
        # schema. The fixture has errors on purpose, so exit 1 is required.
        run: |
          go build -o "$RUNNER_TEMP/gruntled" ./cmd/gruntled
          set +e
          "$RUNNER_TEMP/gruntled" check --format sarif cmd/gruntled/testdata/sarif-fixture > "$RUNNER_TEMP/out.sarif"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "expected exit 1 on the fixture, got $rc"
            exit 1
          fi
          go run github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0 cmd/gruntled/testdata/sarif-schema-2.1.0.json "$RUNNER_TEMP/out.sarif"
      - name: cross-build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "build $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/gruntled
          done

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check-architecture
        run: bash scripts/check-architecture.sh
      - name: test-check-architecture
        run: bash scripts/test-check-architecture.sh

  # Internal proof job: GitHub code scanning must accept gruntled SARIF.
  # It uploads the deliberate-defect fixture only; it is not the user
  # recipe for scanning a real repository (that is Phase 7).
  sarif-upload:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build -o "$RUNNER_TEMP/gruntled" ./cmd/gruntled
      - name: check
        run: |
          set +e
          "$RUNNER_TEMP/gruntled" check --format sarif cmd/gruntled/testdata/sarif-fixture > "$RUNNER_TEMP/gruntled.sarif"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "gruntled check failed with exit $rc"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/gruntled.sarif" ]; then
            echo "SARIF output missing or empty"
            exit 1
          fi
          # gruntled writes URIs relative to the analysed directory; prefix the
          # fixture path so alerts resolve against the repository root.
          jq --arg p cmd/gruntled/testdata/sarif-fixture/ \
            '(.. | .artifactLocation? | objects | .uri) |= $p + .' \
            "$RUNNER_TEMP/gruntled.sarif" > "$RUNNER_TEMP/upload.sarif"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/upload.sarif
          category: gruntled-fixture
