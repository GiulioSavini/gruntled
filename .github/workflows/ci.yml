name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; master runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build with exactly the Go version from go.mod; never switch silently.
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$("$(go env GOROOT)/bin/gofmt" -l .)
          if [ -n "$out" ]; then
            echo "unformatted:"
            echo "$out"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: sarif-schema
        # Real SARIF output must validate against the vendored OASIS 2.1.0
        # schema. The fixture has errors on purpose, so exit 1 is required.
        run: |
          go build -o "$RUNNER_TEMP/gruntled" ./cmd/gruntled
          set +e
          "$RUNNER_TEMP/gruntled" check --format sarif cmd/gruntled/testdata/sarif-fixture > "$RUNNER_TEMP/out.sarif"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "expected exit 1 on the fixture, got $rc"
            exit 1
          fi
          go run github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0 cmd/gruntled/testdata/sarif-schema-2.1.0.json "$RUNNER_TEMP/out.sarif"
      - name: release-build
        # Full release packaging on every run (all 6 targets, ldflags,
        # archives, checksums, host --version smoke), so the release path
        # never fails for the first time at tag time.
        run: bash scripts/build-release.sh v0.0.0-ci "$(git rev-parse --short=12 HEAD)" "$RUNNER_TEMP/dist"

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check-architecture
        run: bash scripts/check-architecture.sh
      - name: test-check-architecture
        run: bash scripts/test-check-architecture.sh

  # Proves the user recipes in docs/ci.md run for real: the documented
  # install + check commands (against the clean fixture, since this repo's
  # root holds the deliberately broken sarif-fixture) and the pre-commit hook
  # via try-repo. sarif-upload below stays the separate code-scanning proof.
  # TestCIDoc keeps the pins and commands here in step with docs/ci.md.
  recipe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install (recipe)
        # Stands in for the recipe's go install ...@<tag>: same command, this checkout.
        run: |
          go install ./cmd/gruntled
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: check (recipe)
        run: gruntled check cmd/gruntled/testdata/clean-fixture
      - name: sarif variant
        run: |
          gruntled check --format sarif cmd/gruntled/testdata/clean-fixture > "$RUNNER_TEMP/r.sarif"
          if [ ! -s "$RUNNER_TEMP/r.sarif" ]; then
            echo "SARIF output missing or empty"
            exit 1
          fi
      - name: recipe fails on broken
        # Exactly 1: a usage error (2) or a failed analysis (3) must not pass.
        run: |
          set +e
          gruntled check cmd/gruntled/testdata/sarif-fixture
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "expected exit 1 on the broken fixture, got $rc"
            exit 1
          fi
      - name: pre-commit hook
        # try-repo builds the hook from this checkout's HEAD (which holds
        # .pre-commit-hooks.yaml), as a consumer's pre-commit would.
        run: |
          pipx install pre-commit==4.6.2
          try_hook() {
            d=$(mktemp -d)
            cp -r "$1"/. "$d"
            git -C "$d" init -q
            git -C "$d" add -A
            git -C "$d" -c user.name=ci -c user.email=ci@example.invalid commit -qm fixture
            set +e
            (cd "$d" && pre-commit try-repo "$GITHUB_WORKSPACE" gruntled-check --all-files)
            rc=$?
            set -e
            if [ "$rc" -ne "$2" ]; then
              echo "pre-commit on $1: expected exit $2, got $rc"
              exit 1
            fi
          }
          try_hook cmd/gruntled/testdata/clean-fixture 0
          try_hook cmd/gruntled/testdata/sarif-fixture 1

  # Internal proof job: GitHub code scanning must accept gruntled SARIF.
  # It uploads the deliberate-defect fixture only; it is not the user
  # recipe for scanning a real repository (that is Phase 7).
  sarif-upload:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build -o "$RUNNER_TEMP/gruntled" ./cmd/gruntled
      - name: check
        run: |
          set +e
          "$RUNNER_TEMP/gruntled" check --format sarif cmd/gruntled/testdata/sarif-fixture > "$RUNNER_TEMP/gruntled.sarif"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "gruntled check failed with exit $rc"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/gruntled.sarif" ]; then
            echo "SARIF output missing or empty"
            exit 1
          fi
          # gruntled writes URIs relative to the analysed directory; prefix the
          # fixture path so alerts resolve against the repository root.
          jq --arg p cmd/gruntled/testdata/sarif-fixture/ \
            '(.. | .artifactLocation? | objects | .uri) |= $p + .' \
            "$RUNNER_TEMP/gruntled.sarif" > "$RUNNER_TEMP/upload.sarif"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/upload.sarif
          category: gruntled-fixture
